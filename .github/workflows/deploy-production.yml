name: Deploy to Play Store Production

on:
  push:
    branches:
      - firebase-account-update
    tags:
      - 'v*'

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Free disk space
        # ubuntu-latest starts with ~14 GB free. Flutter + Gradle + NDK need ~10 GB.
        # Pre-installed tools (.NET, Swift, Haskell, Docker images, etc.) take ~30 GB.
        # This step removes them to avoid "No space left on device" failures.
        run: |
          echo "Disk before cleanup:"
          df -h /
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android/sdk/ndk
          sudo rm -rf /usr/local/lib/android/sdk/build-tools
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY/go"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY/node"
          sudo apt-get clean -y
          docker system prune -af 2>/dev/null || true
          echo "Disk after cleanup:"
          df -h /

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install NDK 28.2.13676358
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "ndk;28.2.13676358"
          echo "✅ NDK 28.2.13676358 installed"
          ls $ANDROID_HOME/ndk/

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/**/*.gradle.kts', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Clean stale build artifacts
        run: |
          flutter clean || true
          rm -rf "${{ github.workspace }}/build"
          rm -rf "${{ github.workspace }}/.dart_tool"
          rm -rf "${{ github.workspace }}/android/build"
          rm -rf "${{ github.workspace }}/android/app/build"
          rm -rf "${{ github.workspace }}/android/local.properties"
          echo "Disk after clean:"
          df -h /

      - name: Create .env file
        run: echo "${{ secrets.ENV_FILE }}" > .env

      - name: Create Firebase FCM Service Account JSON
        run: |
          echo '${{ secrets.FIREBASE_FCM_SERVICE_ACCOUNT_JSON }}' > assets/firebase_service_account.json
          grep -q "private_key" assets/firebase_service_account.json && echo "✅ private_key found" || { echo "❌ private_key MISSING"; exit 1; }
          grep -q "client_email" assets/firebase_service_account.json && echo "✅ client_email found" || { echo "❌ client_email MISSING"; exit 1; }

      - name: Verify .env file
        run: |
          echo "✅ .env file: $(wc -l < .env) lines"
          grep -q "FIREBASE_API_KEY" .env && echo "✅ FIREBASE_API_KEY exists" || echo "❌ FIREBASE_API_KEY MISSING"
          grep -q "BASE_URL" .env && echo "✅ BASE_URL exists" || echo "❌ BASE_URL MISSING"

      - name: Create google-services.json
        run: |
          if [ -z "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo "❌ GOOGLE_SERVICES_JSON secret is MISSING!"
            exit 1
          fi
          echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > android/app/google-services.json
          echo "✅ google-services.json created"

      - name: Create service account JSON
        run: |
          printf '%s' '${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}' > android/asaan-rishta-chat-d848bdbc2a5e.json
          chmod 600 android/asaan-rishta-chat-d848bdbc2a5e.json
          ls -lh android/asaan-rishta-chat-d848bdbc2a5e.json

      - name: Create upload keystore
        run: |
          mkdir -p android/app
          echo "${{ secrets.UPLOAD_KEYSTORE_BASE64 }}" | tr -d '\n' | base64 --decode > android/app/upload-keystore.jks
          ls -lh android/app/upload-keystore.jks

      - name: Create key.properties
        run: |
          KEY_PROPS="${{ secrets.KEY_PROPERTIES }}"
          KEY_PROPS=$(echo "$KEY_PROPS" | sed 's|C:/flutterdev/projects/assaan_rishta/||g')
          KEY_PROPS=$(echo "$KEY_PROPS" | sed 's|storeFile=.*\.jks|storeFile=upload-keystore.jks|g')
          echo "$KEY_PROPS" > android/key.properties

      - name: Flutter pub get
        run: |
          flutter pub cache repair
          flutter pub get

      - name: Patch video_thumbnail (jcenter removed in Gradle 9)
        run: |
          F=$(ls -d "$HOME"/.pub-cache/hosted/pub.dev/video_thumbnail-*/android/build.gradle)
          sed -i 's/jcenter()/mavenCentral()/g' "$F"
          echo "✅ Patched: $F"

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.7'
          bundler-cache: true
          working-directory: android

      - name: Install Fastlane dependencies
        run: cd android && bundle install

      - name: Build AAB
        timeout-minutes: 25
        run: |
          echo "Disk before build:"
          df -h /
          # Flutter exits non-zero due to "Already watching path" watcher exception
          # during VM shutdown — the exception fires AFTER the AAB is written.
          # `timeout 1200` kills the hanging process; we verify success via file.
          timeout 1200 flutter build appbundle \
            --obfuscate \
            --split-debug-info=build/app/outputs/symbols \
            --release || true

          AAB="build/app/outputs/bundle/release/app-release.aab"
          if [ -f "$AAB" ]; then
            echo "✅ AAB ready: $(du -h $AAB | cut -f1)"
            echo "Disk after build:"
            df -h /
          else
            echo "❌ AAB not found — build truly failed"
            exit 1
          fi

      - name: Upload to Play Store Production
        run: cd android && bundle exec fastlane android upload_production