name: Deploy to Play Store Production

on:
  push:
    branches:
      - firebase-account-update
    tags:
      - 'v*'

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install NDK 27.0.12077973
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "ndk;27.0.12077973" || \
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            --install "ndk;27.0.12077973"
          echo "✅ NDK 27.0.12077973 ready"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/**/*.gradle.kts', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Clean stale build artifacts
        shell: bash
        run: |
          echo "Cleaning build artifacts (keeping caches)..."
          flutter clean || true
          rm -rf "${{ github.workspace }}/build"
          rm -rf "${{ github.workspace }}/.dart_tool"
          rm -rf "${{ github.workspace }}/android/build"
          rm -rf "${{ github.workspace }}/android/app/build"
          rm -rf "${{ github.workspace }}/android/local.properties"
          flutter --version
          flutter doctor -v

      - name: Create .env file
        run: |
          echo "${{ secrets.ENV_FILE }}" > .env

      - name: Create Firebase FCM Service Account JSON
        run: |
          echo '${{ secrets.FIREBASE_FCM_SERVICE_ACCOUNT_JSON }}' > assets/firebase_service_account.json
          if [ -f "assets/firebase_service_account.json" ]; then
            echo "✅ Firebase FCM service account file created"
            grep -q "private_key" assets/firebase_service_account.json && echo "✅ private_key field found" || echo "❌ private_key MISSING"
            grep -q "client_email" assets/firebase_service_account.json && echo "✅ client_email field found" || echo "❌ client_email MISSING"
          else
            echo "❌ Failed to create Firebase FCM service account file"
            exit 1
          fi

      - name: Verify .env file
        run: |
          echo "✅ .env file created with $(wc -l < .env) lines"
          grep -q "FIREBASE_API_KEY" .env && echo "✅ FIREBASE_API_KEY exists" || echo "❌ FIREBASE_API_KEY MISSING"
          grep -q "BASE_URL" .env && echo "✅ BASE_URL exists" || echo "❌ BASE_URL MISSING"

      - name: Create google-services.json
        run: |
          if [ -z "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo "❌ GOOGLE_SERVICES_JSON secret is MISSING!"
            exit 1
          fi
          echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > android/app/google-services.json
          echo "✅ google-services.json created successfully"

      - name: Create service account JSON
        run: |
          mkdir -p android
          printf '%s' '${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}' > android/asaan-rishta-chat-d848bdbc2a5e.json
          chmod 600 android/asaan-rishta-chat-d848bdbc2a5e.json
          ls -lh android/asaan-rishta-chat-d848bdbc2a5e.json

      - name: Create upload keystore
        run: |
          mkdir -p android/app
          echo "${{ secrets.UPLOAD_KEYSTORE_BASE64 }}" | tr -d '\n' | base64 --decode > android/app/upload-keystore.jks
          ls -lh android/app/upload-keystore.jks

      - name: Create key.properties
        run: |
          KEY_PROPS="${{ secrets.KEY_PROPERTIES }}"
          KEY_PROPS=$(echo "$KEY_PROPS" | sed 's|C:/flutterdev/projects/assaan_rishta/||g')
          KEY_PROPS=$(echo "$KEY_PROPS" | sed 's|storeFile=.*\.jks|storeFile=upload-keystore.jks|g')
          echo "$KEY_PROPS" > android/key.properties

      - name: Repair Flutter pub cache
        run: |
          flutter pub cache repair
          flutter pub get
      - name: Patch video_thumbnail (jcenter removed in Gradle 9)
        run: |
          F=$(ls -d "$HOME"/.pub-cache/hosted/pub.dev/video_thumbnail-*/android/build.gradle)
          echo "Patching $F"
          sed -i 's/jcenter()/mavenCentral()/g' "$F"
          grep -n "jcenter\|mavenCentral" "$F"
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.7'
          bundler-cache: true
          working-directory: android

      - name: Install Fastlane dependencies
        run: |
          cd android
          bundle install

      - name: Build AAB
        timeout-minutes: 25
        run: |
          # The flutter process hangs after throwing "Already watching path" during
          # VM shutdown — it never exits on its own, so `|| true` alone isn't enough.
          # `timeout 1200` sends SIGTERM after 20 min, forcing the process to die.
          # Both a real build failure (exit 1) and a timeout (exit 124) are caught
          # by `|| true`; we use the presence of the AAB file as the real indicator.
          timeout 1200 flutter build appbundle \
            --obfuscate \
            --split-debug-info=build/app/outputs/symbols \
            --release || true

          AAB="build/app/outputs/bundle/release/app-release.aab"
          if [ -f "$AAB" ]; then
            echo "✅ AAB built successfully: $(du -h $AAB | cut -f1) — $(realpath $AAB)"
          else
            echo "❌ AAB not found at $AAB — build truly failed"
            exit 1
          fi

      - name: Upload to Play Store Production
        run: |
          cd android
          bundle exec fastlane android upload_production